[package]
name = "tidepool"
version = "0.0.12"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8"
clap = { version = "4.6.7", features = ["derive", "env"] }
deunicode = "1.6.2"
etcetera = "0.11.0"
fancy-regex = "0.20.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = { version = "0.2.38", features = ["serde"] }
jsonschema = "0.60.2"
libc = "0.2.191"
pgp = "0.21.0"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "signal"] }
tokio-util = "0.7.20"
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
unicode-normalization = "0.1.26"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
