[category.default]
output_dir = "{title}"
cover_file = "{output_dir}/{title}.gif"
min_duration = "1 hour"
cutoff = "yesterday"
include = ['(unclosed']

[hooks.notify]
command = ["ntfy", "{nope}"]
timeout = "soon"

[sources.lofi]
urls = ["https://www.youtube.com/playlist?list=PLxxxxxxxx"]
exclude = [{ field = "channel", pattern = '[z-a]' }]

[sources.lofi.cleanup]
max_size = "20 gigs"
max_age = "a month"
