[category.default]
output = "{title}"
cover_name = "covers/{title}"
min_duration = "1 hour"
cutoff = "yesterday"
include = ['(unclosed']

[category.default.embed]
tags = { album = "{media_path}" }

[hooks.notify]
command = ["ntfy", "{nope}"]
timeout = "soon"

[sources.lofi]
url = "https://www.youtube.com/playlist?list=PLxxxxxxxx"
exclude = [{ field = "channel", pattern = '[z-a]' }]

[sources.lofi.cleanup]
max_size = "20 gigs"
max_age = "a month"
