[general]
concurrency = 0
duplicates = "move"

[category.default.youtube]
quota_warn_at = 1.5
api_key = 42

[category.default]
cover_file = 42
match_fields = []
include = [1, { field = "comments", pattern = "x" }, { pattern = "y" }]

[category.default.cleanup]
order = "random"
max_items = -1

[hooks.empty]
command = []
on_failure = "explode"

[hooks.missing]
timeout = "1m"

[sources.lofi]
urls = ["https://www.youtube.com/playlist?list=PLxxxxxxxx"]
enabled = "yes"
