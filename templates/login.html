{% extends "layout.html" %}
{% block title %}Sign in · tidepool{% endblock %}
{% block content %}
<article class="login">
  <h2>Sign in</h2>
  {% if failed %}<p class="flash error" role="alert">That's not the token.</p>{% endif %}
  <form method="post" action="/login">
    <label>Token <input type="password" name="token" autocomplete="current-password" required autofocus></label>
    <small class="muted">It's <code>server.token</code> in your config.</small>
    <button type="submit">Sign in</button>
  </form>
</article>
{% endblock %}
