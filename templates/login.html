{% extends "layout.html" %}
{% block title %}Sign in · tidepool{% endblock %}
{% block content %}
<div class="card login">
  <h1>Sign in</h1>
  {% if failed %}<p class="flash error" role="alert">That's not the token.</p>{% endif %}
  <form method="post" action="/login" class="field">
    <label for="token">Token</label>
    <input id="token" type="password" name="token" autocomplete="current-password" required autofocus>
    <span class="hint">It's <code>server.token</code> in your config.</span>
    <button type="submit" class="primary">Sign in</button>
  </form>
</div>
{% endblock %}
