<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}tidepool{% endblock %}</title>
  <link rel="stylesheet" href="{{ crate::web::asset_url("app.css") }}">
  <script src="{{ crate::web::asset_url("htmx.min.js") }}" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
  <div class="app">
    <nav class="topnav">
      <a href="/" class="brand">tidepool</a>
      <div class="links">
        <a href="/" data-section="/">Dashboard</a>
        <a href="/config" data-section="/config">Config</a>
      </div>
    </nav>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
  <div id="toast" class="flash error toast" role="alert" hidden></div>
  <script>
    (function () {
      var path = location.pathname;
      var current = path.indexOf("/config") === 0 ? "/config" : (path === "/login" ? "" : "/");
      document.querySelectorAll(".topnav [data-section]").forEach(function (link) {
        if (link.getAttribute("data-section") === current) link.classList.add("active");
      });

      // htmx drops failed requests silently; say so.
      var toast = document.getElementById("toast");
      var timer = null;
      function fail(text) {
        toast.textContent = text;
        toast.hidden = false;
        clearTimeout(timer);
        timer = setTimeout(function () { toast.hidden = true; }, 8000);
      }
      toast.addEventListener("click", function () { toast.hidden = true; });
      document.addEventListener("htmx:responseError", function (event) {
        var xhr = event.detail.xhr;
        var why = (xhr.responseText || "").trim().slice(0, 300) || xhr.statusText;
        fail("That didn't work (" + xhr.status + "): " + why);
      });
      document.addEventListener("htmx:sendError", function () {
        fail("Couldn't reach tidepool. Is it still running?");
      });
      document.addEventListener("htmx:beforeRequest", function () { toast.hidden = true; });

      // Menus close when you click elsewhere, pick an option, or press Escape.
      function closeMenus(except) {
        document.querySelectorAll("details.menu[open]").forEach(function (menu) {
          if (menu !== except) menu.open = false;
        });
      }
      document.addEventListener("click", function (event) {
        var menu = event.target.closest("details.menu");
        closeMenus(event.target.closest(".menu-items") ? null : menu);
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") closeMenus(null);
      });
    })();
  </script>
</body>
</html>
