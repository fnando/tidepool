{% if let Some(errors) = errors %}
<div class="flash error"><strong>It has mistakes; nothing was saved.</strong><pre>{{ errors }}</pre></div>
{% else if changes.is_empty() %}
<p class="flash">No changes from revision {{ rev }}.</p>
{% else %}
<div class="flash{% if saved %} ok{% endif %}">
  <strong>{% if saved %}Saved. {% endif %}Changes from revision {{ rev }}:</strong>
  <pre>{{ changes.join("\n") }}</pre>
  <details><summary>Text diff</summary><pre>{{ diff }}</pre></details>
</div>
{% endif %}
