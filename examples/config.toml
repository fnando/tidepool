#:schema https://raw.githubusercontent.com/fnando/tidepool/v0.1.0/schema/tidepool.v1.schema.json
#
# Example tidepool config. Import it with:
#
#   tidepool config import examples/config.toml
#
# or pass it on every run (imported only when it changed):
#
#   tidepool run --config ~/.config/tidepool/config.toml

version = 1

[general]                           # settings for the whole run
concurrency = 2                     # parallel yt-dlp downloads
duplicates = "hardlink"             # same video in several sources: hardlink | symlink | copy | download
regex_backtrack_limit = 1000000     # fancy-regex step limit per match
shutdown_timeout = "10s"            # grace period for child processes after SIGINT/SIGTERM

[ytdlp]
managed = true                      # tidepool downloads yt-dlp and keeps it updated
channel = "nightly"                 # stable | nightly | master (nightly is what yt-dlp recommends)
update_check = "1h"                 # how often to look for a new release (one GitHub API call)
path = "yt-dlp"                     # only used when managed = false

[schedule]
interval = "6h"                     # tidepool run --daemon: sync + cleanup this often; "" = off

[server]                            # web UI served by tidepool run --daemon
enabled = true                      # false = sync daemon only, no UI
listen = "127.0.0.1:8787"
token = ""                          # required for a non-loopback listen address
read_only_config = false            # true = config editor disabled

# Every source uses [category.default]; a source with category = "audio" gets
# [category.audio] on top of it.

[category.default]
media_dir = "~/Videos/youtube"      # {media_dir}; default ~/.local/share/tidepool/media
tmp_dir = "{data_dir}/tmp"          # downloads in progress; default {data_dir}/tmp
format = "bv*[height<=1080]+ba/b"
merge_output_format = "mkv"
output_dir = "{media_dir}/{source}/{upload_date} - {title} [{id}]"  # each video's folder, a full path
output_file = "{output_dir}/{normalized_title}.{ext}"            # the media file
cover_file = "{output_dir}/{normalized_title}-poster.jpg"        # .jpg, .png or .webp
subtitle_file = "{output_dir}/{normalized_title}.{lang}.{ext}"   # each subtitle
metadata_file = "{output_dir}/metadata.json"
ytdlp_args = ["--write-subs", "--sub-langs", "en.*"]
cookies_file = ""                   # optional, for private playlists
match_fields = ["title"]            # default field(s) for plain-string rules
include = []
exclude = ['(?i)#shorts']
min_duration = "60s"
max_duration = "4h"
cutoff = "30d"                      # skip videos published more than 30d ago; "2024-01-01" also works
hooks = []
redownload_missing = false          # once downloaded, never fetch again even if the file is gone

[category.default.youtube]
# api_key = "AIza..."               # optional; without it, indexing uses yt-dlp only
daily_quota = 10000                 # raise only if Google granted your project an extension
quota_warn_at = 0.8                 # warn in logs and the web UI at 80% of daily_quota
fallback_to_ytdlp = true            # with a key: use yt-dlp on quota/5xx; always on without api_key
requests_per_second = 5

[category.default.embed]            # everything is off unless turned on here, per category or per source
metadata = true                     # title, channel, date, description, URL, album/track
cover = true                        # same image as the poster file
chapters = true
subtitles = true                    # languages from --sub-langs
info_json = false                   # attach metadata.json (mkv/mka only)
after_hooks = true                  # re-embed if a hook replaced the media file
tags = { genre = "Music", album_artist = "{channel}" }

[category.default.cleanup]
max_items = 0                       # 0 = unlimited
max_age = ""                        # e.g. "30d"
max_size = ""                       # e.g. "20GiB"
order = "oldest_downloaded"         # oldest_downloaded | oldest_published | source_position
removed_from_source = "keep"        # keep | remove
keep = "metadata"                   # nothing | metadata (keep json + cover, drop media)

[category.audio]                    # only what differs from default
media_dir = "~/Music/youtube"       # audio goes somewhere else
format = "ba/b"                     # audio only
ytdlp_args = ["-x", "--audio-format", "opus"]
cover_file = "{output_dir}/cover.jpg"
cutoff = "none"                     # keep the whole back catalogue
inherit_rules = true                # add to default's include/exclude instead of replacing them

[hooks.transcode]
command = ["/usr/local/bin/to-h265.sh", "{media_path}"]
timeout = "30m"
on_failure = "fail"                 # fail | warn | retry
retries = 2
env = { CRF = "26" }

[hooks.notify]
command = ["ntfy", "publish", "videos", "New: {title}"]
timeout = "30s"
on_failure = "warn"

[sources.lofi]
url = "https://www.youtube.com/playlist?list=PLxxxxxxxx"   # the playlist's URL
enabled = true
include = ['(?i)\blive\b', { field = "channel", pattern = '^Lofi Girl$' }]
exclude = ['(?i)\b(trailer|teaser)\b']
hooks = ["transcode", "notify"]

[sources.lofi.cleanup]
max_items = 50
max_age = "30d"
removed_from_source = "remove"

[sources.talks]
url = "https://www.youtube.com/playlist?list=PLyyyyyyyy"
category = "audio"                  # [category.default], then [category.audio], then what's set here
